[package]
name = "copilot"
version = "0.3.0"
edition = "2021"
description = "Local-first AI interview & meeting copilot (BYOK)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "Copilot"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
ort = "=2.0.0-rc.15"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
cpal = "0.18"
tray-icon = "0.26"
global-hotkey = "0.9"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
unicode-normalization = "0.1"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Audio DSP, VAD and the ONNX gate run per 20 ms frame; debug builds would fall behind real time.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
