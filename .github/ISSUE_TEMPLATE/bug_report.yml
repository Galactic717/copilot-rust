name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom left of the main window.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostics report
      description: Settings → Diagnostics → Save a report for support, then attach the file. It holds no keys and no conversation text; you can read it first.
