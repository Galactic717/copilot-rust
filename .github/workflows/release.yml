name: Release

# Push a tag like v0.3.0 to build on a clean Windows runner and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          dir="Copilot-${ver}-windows-x64"
          mkdir "$dir"
          cp target/release/Copilot.exe "$dir/"
          cp target/release/*.dll "$dir/" 2>/dev/null || true
          cp README.md LICENSE "$dir/"
          7z a "${dir}.zip" "$dir" > /dev/null
          sha=$(sha256sum "${dir}.zip" | awk '{print $1}')
          notes="Локальний AI-копілот для інтерв'ю та зустрічей (Windows). Розпізнавання мовлення на вашому ПК, відповіді від вашої моделі (BYOK) або локально через llama.cpp.

          **Встановлення:** розпакуйте \`${dir}.zip\` і запустіть \`Copilot.exe\`. Файл не підписаний сертифікатом — Windows SmartScreen може показати «Невідомий видавець»: «Докладніше» → «Однаково запустити».

          **SHA-256** \`${dir}.zip\`:
          \`${sha}\`"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Copilot ${GITHUB_REF_NAME}" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" "${dir}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Copilot ${GITHUB_REF_NAME}" --notes "$notes" "${dir}.zip"
          fi
